components:
  schemas:
    AssistantAccessResponseV1:
      description: "Explain access: per table, the user's UI permissions, the assistant's\
        \ data access, and each tool's verdict."
      properties:
        tables:
          items:
            additionalProperties: true
            description: "table, label, dataAccess, dataAccessSource, ui {visible,\
              \ read, insert, edit, delete}, operations [{tool, operation, allowed,\
              \ reason}]."
            type: "object"
          type: "array"
      type: "object"
    AssistantActionV1:
      description: "A write the assistant proposed and its state."
      properties:
        id:
          type: "integer"
        status:
          description: "PENDING, RUNNING, EXECUTED, FAILED, REJECTED or EXPIRED."
          type: "string"
        toolName:
          type: "string"
        tableName:
          type: "string"
        recordId:
          nullable: true
          type: "string"
        summary:
          type: "string"
        httpStatus:
          description: "The UI API status of the write."
          nullable: true
          type: "integer"
        resultSummary:
          nullable: true
          type: "string"
        expiresAt:
          nullable: true
          type: "string"
        outcome:
          description: "After a confirm: the tool outcome."
          nullable: true
          type: "string"
        message:
          description: "After a confirm: what happened."
          nullable: true
          type: "string"
        href:
          description: "After a confirm: the written record's /app link."
          nullable: true
          type: "string"
      type: "object"
    AssistantActiveTurnsResponseV1:
      description: "The caller's active runs, newest first; stale leases are reaped."
      properties:
        turns:
          items:
            description: "An active assistant run."
            properties:
              turnId:
                type: "integer"
              conversationId:
                type: "integer"
              assistantMessageId:
                type: "integer"
              userMessageId:
                type: "integer"
              status:
                description: "RUNNING or CANCELLING."
                type: "string"
              phase:
                type: "string"
              startedAt:
                description: "ISO-8601."
                type: "string"
              heartbeatAt:
                description: "ISO-8601."
                type: "string"
              elapsedMs:
                type: "integer"
              live:
                description: "Running on this replica."
                type: "boolean"
              concurrencyMode:
                description: "SUPERSEDE or CONCURRENT."
                type: "string"
            type: "object"
          type: "array"
      type: "object"
    AssistantConfigResponseV1:
      description: "Whether the assistant is available to this user, and how."
      properties:
        enabled:
          description: "Whether the panel may be used."
          type: "boolean"
        reason:
          description: "Why not: DISABLED, NO_PERMISSION, NOT_CONFIGURED or KILL_SWITCH."
          nullable: true
          type: "string"
        shortcut:
          description: "Keyboard shortcut, e.g. mod+j."
          type: "string"
        model:
          description: "The model that answers."
          type: "string"
        limits:
          additionalProperties: true
          description: "maxTurnSeconds and maxToolCallsPerTurn."
          type: "object"
        features:
          additionalProperties: true
          description: "writes: some table allows writes; pendingActions: writes wait\
            \ for confirmation."
          type: "object"
        profile:
          $ref: "#/components/schemas/AssistantProfileV1"
      type: "object"
    AssistantConversationDetailResponseV1:
      description: "A conversation and a page of its messages, oldest first."
      properties:
        conversation:
          $ref: "#/components/schemas/AssistantConversationV1"
        messages:
          items:
            $ref: "#/components/schemas/AssistantMessageV1"
          type: "array"
      type: "object"
    AssistantConversationListResponseV1:
      description: "The user's conversations, newest first."
      properties:
        conversations:
          items:
            $ref: "#/components/schemas/AssistantConversationV1"
          type: "array"
      type: "object"
    AssistantConversationV1:
      description: "One of the user's own conversations."
      properties:
        id:
          type: "integer"
        title:
          nullable: true
          type: "string"
        status:
          description: "ACTIVE or ARCHIVED."
          type: "string"
        pinned:
          type: "boolean"
        lastMessageAt:
          description: "ISO-8601 instant."
          nullable: true
          type: "string"
        unreadCount:
          type: "integer"
        createDate:
          description: "ISO-8601 instant."
          nullable: true
          type: "string"
      type: "object"
    AssistantErrorV1:
      description: "Deprecated since 1.4.0: errors use BasicErrorResponseV1."
      properties:
        error:
          description: "A message for the user."
          type: "string"
        code:
          description: "BUDGET, RATE_LIMIT, NOT_CONFIGURED, KILL_SWITCH, DISABLED,\
            \ NO_PERMISSION..."
          nullable: true
          type: "string"
      type: "object"
    AssistantMessageV1:
      description: "A message: the user's text or the assistant's reply as parts (text,\
        \ tool, record_refs, navigate, notice)."
      properties:
        id:
          type: "integer"
        role:
          description: "USER or ASSISTANT."
          type: "string"
        status:
          type: "string"
        turnId:
          nullable: true
          type: "integer"
        createDate:
          nullable: true
          type: "string"
        parts:
          items:
            additionalProperties: true
            description: "A message part."
            type: "object"
          type: "array"
      type: "object"
    AssistantProfileV1:
      description: "How the assistant presents itself (admin-configured; text only,\
        \ it never changes access)."
      properties:
        displayName:
          description: "The assistant's name."
          type: "string"
        icon:
          description: "A Material icon name."
          type: "string"
        greeting:
          description: "Shown on a new conversation."
          nullable: true
          type: "string"
        starterPrompts:
          description: "Suggested first questions."
          items:
            type: "string"
          type: "array"
      type: "object"
    AssistantRecordsRenderV1:
      description: "A tool part's render of type records (query results). columns\
        \ and rows are always present - empty when the query matched nothing (since\
        \ 1.4.0; older stored parts are completed when read)."
      properties:
        type:
          description: "records"
          type: "string"
        tableName:
          type: "string"
        tableLabel:
          type: "string"
        columns:
          description: "Always present; empty when nothing matched."
          items:
            description: "A column."
            properties:
              name:
                type: "string"
              label:
                type: "string"
            type: "object"
          type: "array"
        rows:
          description: "Always present; empty when nothing matched."
          items:
            description: "A row."
            properties:
              id:
                description: "The primary key."
                type: "string"
              href:
                description: "The record's /app link."
                type: "string"
              values:
                additionalProperties: true
                description: "Display values by column name."
                type: "object"
            type: "object"
          type: "array"
        totalCount:
          description: "All matching rows."
          nullable: true
          type: "integer"
        truncated:
          description: "More rows match than are shown."
          type: "boolean"
        openHref:
          description: "The Query screen link."
          type: "string"
      type: "object"
    AssistantStatusResponseV1:
      description: "An acknowledgement."
      properties:
        status:
          type: "string"
      type: "object"
    AssistantTurnEventV1:
      description: "One server-sent event of a turn (event: <type>, id: <seq>, data:\
        \ this object). Types: message.start, turn.phase, text.delta, tool.start,\
        \ tool.result, ui.navigate, notice, usage, message.end, error, ping."
      properties:
        seq:
          description: "Sequence number; resume with ?after=<seq>."
          type: "integer"
        type:
          description: "The event type (also the SSE event name)."
          type: "string"
        data:
          additionalProperties: true
          description: "The event's fields, by type. message.start includes startedAt\
            \ (ISO-8601). turn.phase includes phase (thinking, tool, writing), optional\
            \ toolName and label."
          type: "object"
      type: "object"
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "QQQ Assistant: conversations, streamed turns, feedback, pending actions\
    \ and data access explanations"
  title: "QQQ Middleware API extension: assistant"
  version: "1.4.0"
openapi: "3.0.3"
paths:
  /qqq/v1/assistant/config:
    get:
      description: "Whether the assistant is available to this user, its persona and\
        \ limits"
      operationId: "getAssistantConfig"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "No access to the assistant"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found (or not the user's own)"
        503:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Disabled, not configured, or the kill switch is on"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConfigResponseV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Already finished or decided"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Budget or rate limit"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Whether the assistant is available to this user, its persona and limits"
      tags:
      - "assistant"
  /qqq/v1/assistant/conversations:
    get:
      description: "The user's own conversations"
      operationId: "getAssistantConversations"
      parameters:
      - description: "ARCHIVED for archived conversations; active ones by default."
        in: "query"
        name: "status"
        required: false
        schema:
          type: "string"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "No access to the assistant"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found (or not the user's own)"
        503:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Disabled, not configured, or the kill switch is on"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationListResponseV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Already finished or decided"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Budget or rate limit"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "The user's own conversations"
      tags:
      - "assistant"
    post:
      description: "Start a conversation"
      operationId: "postAssistantConversations"
      requestBody:
        content:
          application/json:
            schema:
              description: "Optional title and the page context it starts from."
              properties:
                title:
                  type: "string"
                context:
                  additionalProperties: true
                  description: "route, tableName, recordId, filter, selectedIds."
                  type: "object"
              type: "object"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "No access to the assistant"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found (or not the user's own)"
        503:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Disabled, not configured, or the kill switch is on"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Already finished or decided"
        201:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationV1"
          description: "Successful Response"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Budget or rate limit"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Start a conversation"
      tags:
      - "assistant"
  /qqq/v1/assistant/conversations/{id}:
    delete:
      description: "Delete a conversation"
      operationId: "deleteAssistantConversationsById"
      parameters:
      - description: "The conversation id."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "integer"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "No access to the assistant"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found (or not the user's own)"
        503:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Disabled, not configured, or the kill switch is on"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Already finished or decided"
        204:
          description: "Done (no body)"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Budget or rate limit"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Delete a conversation"
      tags:
      - "assistant"
    get:
      description: "A conversation and a page of its messages"
      operationId: "getAssistantConversationsById"
      parameters:
      - description: "The conversation id."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "integer"
      - description: "Only messages older than this message id."
        in: "query"
        name: "before"
        required: false
        schema:
          type: "integer"
      - description: "Page size (default 50, at most 200)."
        in: "query"
        name: "limit"
        required: false
        schema:
          type: "integer"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "No access to the assistant"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found (or not the user's own)"
        503:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Disabled, not configured, or the kill switch is on"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationDetailResponseV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Already finished or decided"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Budget or rate limit"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "A conversation and a page of its messages"
      tags:
      - "assistant"
    patch:
      description: "Rename, pin or archive a conversation"
      operationId: "patchAssistantConversationsById"
      parameters:
      - description: "The conversation id."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "integer"
      requestBody:
        content:
          application/json:
            schema:
              description: "The changed properties."
              properties:
                title:
                  type: "string"
                pinned:
                  type: "boolean"
                status:
                  description: "ACTIVE or ARCHIVED."
                  type: "string"
              type: "object"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "No access to the assistant"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found (or not the user's own)"
        503:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Disabled, not configured, or the kill switch is on"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Already finished or decided"
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Budget or rate limit"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Rename, pin or archive a conversation"
      tags:
      - "assistant"
  /qqq/v1/assistant/conversations/{id}/turns:
    post:
      description: "Ask: start a turn and stream the reply as server-sent events"
      operationId: "postAssistantConversationsByIdTurns"
      parameters:
      - description: "The conversation id."
        in: "path"
        name: "id"
        required: true
        schema:
          type: "integer"
      requestBody:
        content:
          application/json:
            schema:
              description: "The user's text and the page context hint."
              properties:
                text:
                  description: "The user's message."
                  type: "string"
                pageContext:
                  additionalProperties: true
                  description: "Where the user is in the app."
                  type: "object"
                concurrency:
                  description: "supersede or concurrent (case-insensitive); defaults\
                    \ to the host configuration."
                  type: "string"
              type: "object"
